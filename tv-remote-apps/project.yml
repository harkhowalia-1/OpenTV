name: TVRemote
options:
  bundleIdPrefix: com.harkhowalia
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 67439D6VU8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TVRemote:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
      - path: Resources/iOS.xcassets
      - path: Resources/RemoteIcon.icon   # Icon Composer: layered, with light, dark and tinted looks
    dependencies:
      - target: TVRemoteControls
      - target: TVRemoteShare
    entitlements:
      path: iOS/TVRemote.entitlements
      properties:
        com.apple.security.application-groups: [group.com.harkhowalia.tvremote]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Otv Remote
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSLocalNetworkUsageDescription: Otv Remote finds and controls your TV on your Wi-Fi network.
        NSBonjourServices: [_tvremote._tcp]
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tvremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harkhowalia.tvremote
        ASSETCATALOG_COMPILER_APPICON_NAME: RemoteIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  TVRemoteControls:
    type: app-extension
    platform: iOS
    sources:
      - Controls
      - Shared/RemoteClient.swift
      - Shared/Intents.swift
    entitlements:
      path: Controls/TVRemoteControls.entitlements
      properties:
        com.apple.security.application-groups: [group.com.harkhowalia.tvremote]
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: Otv Remote
        NSLocalNetworkUsageDescription: Otv Remote controls your TV on your Wi-Fi network.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harkhowalia.tvremote.controls
        TARGETED_DEVICE_FAMILY: "1"
  TVRemoteShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared/RemoteClient.swift
    entitlements:
      path: Share/TVRemoteShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.harkhowalia.tvremote]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Send to TV
        NSLocalNetworkUsageDescription: Send to TV opens links on your TV over your Wi-Fi network.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harkhowalia.tvremote.share
        TARGETED_DEVICE_FAMILY: "1"
  TVRemoteMac:
    type: application
    platform: macOS
    sources:
      - Shared/RemoteClient.swift
      - Shared/ControlChannel.swift
      - Shared/RemoteModel.swift
      - Shared/RemoteView.swift
      - path: Mac
        excludes: ["*.h"]
      - path: Resources/Mac.xcassets
      - path: Resources/scrcpy
        buildPhase: resources
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: OpenTV Companion
        CFBundleName: OpenTV Companion
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: OpenTV Companion finds and controls your TV on your Wi-Fi network.
        NSBonjourServices: [_tvremote._tcp, _adb-tls-connect._tcp, _adb-tls-pairing._tcp]
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSAppleEventsUsageDescription: OpenTV Companion sends the page open in your browser to the TV.
        NSScreenCaptureUsageDescription: OpenTV Companion shows your screen on the TV when you use the TV as a display.
    entitlements:
      path: Mac/TVRemoteMac.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harkhowalia.tvremote.mac
        SWIFT_OBJC_BRIDGING_HEADER: Mac/VirtualDisplay.h
        PRODUCT_NAME: OpenTV Companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES

  OpenTVInstaller:
    type: application
    platform: macOS
    sources:
      - Installer
      - Mac/ADB.swift
      - path: Resources/Installer.xcassets
    info:
      path: Installer/Info.plist
      properties:
        CFBundleDisplayName: OpenTV Installer
        CFBundleName: OpenTV Installer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: OpenTV Installer finds your TV on your network to set it up.
        NSBonjourServices: [_adb-tls-connect._tcp, _adb-tls-pairing._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harkhowalia.opentv.installer
        MARKETING_VERSION: "1.0"
        PRODUCT_NAME: OpenTV Installer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
