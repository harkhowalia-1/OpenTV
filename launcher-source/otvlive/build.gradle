plugins {
    id 'com.android.application'
}

// Otv Live: every free TV channel listed by iptv-org (github.com/iptv-org/iptv), in an Apple TV-style app.
android {
    namespace 'com.gathin.otvlive'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.otvlive'
        minSdk 26
        targetSdk 34
        // The release version (scripts/release.sh passes -PotvVersion=1.2): Software Update compares against it.
        def v = (project.findProperty('otvVersion') ?: '1.2').toString()
        def parts = (v.tokenize('.') + ['0', '0']).take(3).collect { it.toInteger() }
        versionCode 100000 + parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName v
    }

    buildTypes {
        release {
            minifyEnabled false
            // Release (not debuggable, so Android compiles it ahead of time and runs it faster), signed with the
            // same key as before so it updates in place: no reinstall, nothing to pair again.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Live streams: HLS (most channels), DASH and plain HTTP, with hardware decoding.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
}
