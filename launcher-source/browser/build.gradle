plugins {
    id 'com.android.application'
}

// Browser: a Safari-style web browser for the TV (WebView), made for the remote and the iPhone remote.
android {
    namespace 'com.gathin.otvbrowser'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.otvbrowser'
        minSdk 26
        targetSdk 34
        // The release version (scripts/release.sh passes -PotvVersion=1.3): Software Update compares against it.
        def v = (project.findProperty('otvVersion') ?: '1.3').toString()
        def parts = (v.tokenize('.') + ['0', '0']).take(3).collect { it.toInteger() }
        versionCode 100000 + parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName v
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
