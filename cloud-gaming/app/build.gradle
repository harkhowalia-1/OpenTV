plugins {
    id 'com.android.application'
}

android {
    namespace 'local.cloudgaming'
    compileSdk 34

    defaultConfig {
        applicationId 'local.cloudgaming'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
